<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>商品展示網站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>商品展示網站</h1>
      <p>可搜尋與分類的產品型錄</p>
    </header>

    <div class="controls">
      <input id="search-box" type="text" placeholder="輸入商品名稱或關鍵字" class="search-box" />
      <select id="category-filter" style="padding: 6px 8px; margin-left: 8px;">
        <!-- 選單會由 script.js 自動產生 -->
      </select>
    </div>

    <div class="product-list" id="product-list">
      <!-- 商品由 JS 動態產生 -->
    </div>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
